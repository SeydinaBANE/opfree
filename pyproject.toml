[project]
name = "incident-copilot"
version = "0.1.0"
description = "Production-grade multi-agent SRE incident diagnosis copilot (LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bane Seydina" }]
dependencies = [
    "anthropic>=0.49",
    "langchain-anthropic>=0.3",
    "langgraph>=0.3",
    "mcp>=1.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "rich>=13.9",
    "structlog>=25.1",
    "typer>=0.15",
]

[project.scripts]
incident-copilot = "incident_copilot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "ARG", "PTH", "RET", "TRY", "PL", "ANN",
]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["incident_copilot"]
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/incident_copilot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
